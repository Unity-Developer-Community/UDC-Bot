---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-server-data
  namespace: udc-bot-dev
  labels:
    app.kubernetes.io/name: udc-bot
    app.kubernetes.io/part-of: udc-bot
    environment: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udc-bot
  namespace: udc-bot-dev
  labels:
    app.kubernetes.io/name: udc-bot
    app.kubernetes.io/part-of: udc-bot
    environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: udc-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udc-bot
        app.kubernetes.io/part-of: udc-bot
        environment: dev
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: bot
          image: ghcr.io/unity-developer-community/udc-bot-dev:19623c7
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: UDCBOT_DiscordConnection__Token
              valueFrom:
                secretKeyRef:
                  name: discord-bot-token
                  key: identifiant
            - name: UDCBOT_Database__ConnectionString
              value: "Host=postgresql;Port=5432;Database=udcbot;Username=udcbot;Password=$(DB_PASSWORD)"
            - name: UDCBOT_Weather__ApiKey
              valueFrom:
                secretKeyRef:
                  name: bot-api-keys
                  key: weather-api-key
            - name: UDCBOT_Airport__FlightApiKey
              valueFrom:
                secretKeyRef:
                  name: bot-api-keys
                  key: flight-api-key
            - name: UDCBOT_Airport__FlightApiSecret
              valueFrom:
                secretKeyRef:
                  name: bot-api-keys
                  key: flight-api-secret
            - name: UDCBOT_Airport__AirLabsApiKey
              valueFrom:
                secretKeyRef:
                  name: bot-api-keys
                  key: airlab-api-key
          volumeMounts:
            - name: app-settings
              mountPath: /app/Settings
            - name: server-data
              mountPath: /app/SERVER
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
      volumes:
        - name: app-settings
          projected:
            sources:
              - configMap:
                  name: bot-config
              - configMap:
                  name: bot-rules
              - configMap:
                  name: bot-faqs
              - configMap:
                  name: bot-slap
        - name: server-data
          persistentVolumeClaim:
            claimName: bot-server-data
